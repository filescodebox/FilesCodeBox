name: Release

# 生态列车快照发布：tag v* → Release(说明 = release/train.yaml 组件矩阵 + 产物线导航;
# train.yaml 缺失时——如历史 tag 重跑——退回静态模板)。Latest 恒属于本线,
# 组件回挂(desktop-v*/fnos-v*/openwrt-v*/p2p-v*/synology-v*/qnap-v*/ugreen-v*/terramaster-v*)一律 --latest=false。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 说明由列车真相源渲染(scripts/release-train.sh notes),与 verify/finalize 同一实现
      - name: 生成说明(列车组件矩阵)
        run: bash scripts/release-train.sh notes "${{ github.ref_name }}" > notes.md
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PigeonBox ${{ github.ref_name }}"
          body_path: notes.md
          make_latest: true
