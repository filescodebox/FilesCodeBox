<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6470e0"/>
      <stop offset="1" stop-color="#3d4494"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- v4:圆构信鸽(大圆身+圆头+圆角尾+泪滴翼),衔接处靠重叠消隐 -->
  <g>
    <!-- 尾:圆角三角 -->
    <path d="M192 276 Q108 272 66 326 Q136 356 202 330 Q214 298 192 276 Z" fill="#ffffff" opacity="0.85"/>
    <!-- 身体:大圆 -->
    <circle cx="245" cy="295" r="96" fill="#ffffff"/>
    <!-- 头:圆,与身体重叠成颈线 -->
    <circle cx="368" cy="238" r="58" fill="#ffffff"/>
    <!-- 翼:泪滴掠面,两片 -->
    <path d="M232 262 C 256 196, 318 138, 402 108 C 398 162, 366 218, 300 256 Z" fill="#ffffff" opacity="0.93"/>
    <path d="M232 262 C 282 226, 348 208, 402 108 C 396 170, 350 232, 288 262 Z" fill="#d8dcf5" opacity="0.85"/>
    <!-- 眼 -->
    <circle cx="382" cy="222" r="8" fill="#3d4494"/>
    <!-- 喙:琥珀 -->
    <path d="M424 234 L 466 246 L 422 258 Z" fill="#f5a623"/>
    <!-- 胸部高光:弧线 -->
    <path d="M186 322 Q 232 366 296 362" stroke="#d8dcf5" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
</svg>
