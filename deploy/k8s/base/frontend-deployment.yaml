apiVersion: apps/v1
kind: Deployment
metadata:
  name: filecodebox-frontend
  namespace: filecodebox
  labels:
    app: filecodebox
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filecodebox
      component: frontend
  template:
    metadata:
      labels:
        app: filecodebox
        component: frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: ghcr.io/filescodebox/frontend:latest
          imagePullPolicy: IfNotPresent
          # 反代上游 = 后端 Service(镜像内 envsubst 渲染进 nginx 配置)
          env:
            - name: BACKEND_HOST
              value: filecodebox
            - name: BACKEND_PORT
              value: "12345"
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
