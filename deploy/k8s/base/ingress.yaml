apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pigeonbox
  namespace: pigeonbox
  labels:
    app: pigeonbox
  annotations:
    # 按实际 ingress controller 调整（nginx-ingress 示例）
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"  # 允许大文件上传
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx  # 按集群实际 IngressClass 修改
  tls:
    - hosts:
        - pigeonbox.example.com  # 替换为实际域名
      secretName: pigeonbox-tls   # 替换为实际 TLS Secret
  rules:
    - host: pigeonbox.example.com  # 替换为实际域名
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # 流量统一进 frontend(nginx)容器, API 由其反代到 pigeonbox Service
                name: pigeonbox-frontend
                port:
                  name: http
