apiVersion: v1
kind: Secret
metadata:
  name: filecodebox-secret
  namespace: filecodebox
  labels:
    app: filecodebox
type: Opaque
stringData:
  # ⚠️ 生产部署前必须替换为真实强随机值！
  # 生成方式: openssl rand -hex 32
  # 注意: 占位值在服务端密钥黑名单中——忘记替换时 server 启动即失败(crash-loop),
  # 这是刻意的 fail-fast,不是 bug。见 overlays/prod/kustomization.yaml 头部说明。
  FCB_JWT_SECRET: "REPLACE_WITH_STRONG_RANDOM_SECRET"
  FCB_REDIS_PASSWORD: ""
  # 使用 MySQL/Postgres 时填写（默认 SQLite 留空）
  FCB_DATABASE_PASSWORD: ""
